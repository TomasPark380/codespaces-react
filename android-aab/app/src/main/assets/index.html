<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bio-OS PDKI Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#09131c;color:#eaf4f8;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#12222e;border:1px solid #28404f;border-radius:18px;padding:18px;margin:14px 0}h1{font-size:25px;margin:6px 0}h2{font-size:18px}small,.muted{color:#9fb3bf}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;color:#b9cbd4}input,select{width:100%;margin-top:6px;padding:12px;border-radius:11px;border:1px solid #3b5667;background:#0d1a23;color:white;font-size:16px}.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px}.score{padding:16px;border-radius:15px;background:#0c1a23}.score b{display:block;font-size:30px;margin-top:7px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{padding:12px;background:#0d1a23;border-radius:12px}.metric b{display:block;font-size:21px;margin-top:5px}button{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:#49c2d4;color:#041016;width:100%}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#334b5a;color:#dbe9ef}.warn{font-size:12px;line-height:1.55;color:#c9d6dc}@media(max-width:520px){.grid,.scores{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><span class="pill">Research prototype</span><h1>Bio-OS PDKI Lab</h1><p class="muted">지질·ApoE·FH·NIR 기반 로컬 분석</p><div class="card"><h2>입력</h2><div class="grid"><label>LDL mg/dL<input id="ldl" type="number" step="0.1" value="130"></label><label>ApoB mg/dL<input id="apob" type="number" step="0.1" value="95"></label><label>ApoE<select id="apoe"><option>e2/e2</option><option>e2/e3</option><option>e2/e4</option><option selected>e3/e3</option><option>e3/e4</option><option>e4/e4</option></select></label><label>K_kor<input id="kkor" type="number" step="0.001" value="1.036"></label><label>FH<select id="fh"><option selected>non_FH</option><option>uncertain</option><option>FH_suspected</option></select></label><label>1392nm<input id="n1" type="number" step="0.001" value="0.318"></label><label>1720nm<input id="n2" type="number" step="0.001" value="0.227"></label><label>1760nm<input id="n3" type="number" step="0.001" value="0.251"></label></div></div><div class="scores"><div class="score"><small>PDKI</small><b id="pdki">25.4</b><span>/100</span></div><div class="score"><small>aAge Risk</small><b id="aage">61.2</b><span id="band">Borderline</span></div></div><div class="card"><h2>예측 지질 패널</h2><div class="metrics"><div class="metric"><small>LDL</small><b id="o1">133.4</b></div><div class="metric"><small>HDL</small><b id="o2">50.0</b></div><div class="metric"><small>중성지방</small><b id="o3">150.3</b></div><div class="metric"><small>Total Chol</small><b id="o4">213.4</b></div></div></div><div class="card"><h2>Bio-OS 요약</h2><p id="summary" class="warn"></p><button id="save">분석 기록 저장</button><p id="saved" class="muted"></p></div><div class="card warn">이 앱은 연구용 프로토타입입니다. PDKI와 aAge Risk는 임상 검증된 진단·생물학적 나이 지표가 아니며, FH 분류와 NIR 값도 의료적 판단에 사용할 수 없습니다.</div></div><script>const $=id=>document.getElementById(id);const ids=['ldl','apob','apoe','kkor','fh','n1','n2','n3'];function c(){let l=+$('ldl').value||0,a=+$('apob').value||0,k=+$('kkor').value||1,n1=+$('n1').value||0,n2=+$('n2').value||0,n3=+$('n3').value||0;let nw=.4*n1+.35*n2+.25*n3,nd=(nw-.270)/.01;let le=l*k*.99027+nd*.18;let h=50-nd*.15;let tg=150.3+nd*.7+(a-95)*.25;let geno={'e2/e2':-4,'e2/e3':-2,'e2/e4':2,'e3/e3':0,'e3/e4':5,'e4/e4':9}[$('apoe').value]||0;let fh={'non_FH':0,'uncertain':8,'FH_suspected':18}[$('fh').value]||0;let p=25.4+(le-133.4)*.16+(a-95)*.11+(tg-150.3)*.035+geno+fh+nd*.22;p=Math.max(0,Math.min(100,p));let ar=Math.max(0,Math.min(100,40+.83465*p));let tc=le+h+tg/5;let band=ar<40?'Low':ar<60?'Moderate':ar<75?'Borderline':'High';$('o1').textContent=le.toFixed(1);$('o2').textContent=h.toFixed(1);$('o3').textContent=tg.toFixed(1);$('o4').textContent=tc.toFixed(1);$('pdki').textContent=p.toFixed(1);$('aage').textContent=ar.toFixed(1);$('band').textContent=band;$('summary').textContent=`ApoE ${$('apoe').value}, FH ${$('fh').value}, NIR 가중흡광도 ${nw.toFixed(3)}. 현재 모델은 ${band} 범위의 연구용 죽상경화 위험 신호를 표시합니다.`;return{ldl:le,hdl:h,tg,tc,pdki:p,aage:ar,band,apoe:$('apoe').value,fh:$('fh').value,nir:nw,time:new Date().toISOString()}}ids.forEach(i=>$(i).addEventListener('input',c));$('save').onclick=()=>{let x=c(),arr=JSON.parse(localStorage.getItem('pdki_records')||'[]');arr.push(x);localStorage.setItem('pdki_records',JSON.stringify(arr));$('saved').textContent=`기록 ${arr.length}건이 기기에 저장되었습니다.`};c();</script></body></html>
